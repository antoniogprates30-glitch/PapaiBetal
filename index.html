<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLuck - Pirate Edition</title>
    <style>
        :root {
            --primary-red: #e74c3c;
            --accent-gold: #f1c40f;
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
            --pill-radius: 50px;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: white;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px; background: #111; border-right: 1px solid #222;
            display: flex; flex-direction: column; padding: 25px; gap: 10px;
        }
        .sidebar h2 { color: var(--primary-red); text-align: center; letter-spacing: 3px; margin-bottom: 30px; }
        .sidebar button {
            background: transparent; border: none; color: #555; padding: 14px;
            text-align: left; cursor: pointer; border-radius: 12px; transition: 0.3s;
            font-weight: bold; font-size: 0.95rem;
        }
        .sidebar button.active { background: var(--primary-red); color: white; }
        .sidebar button:hover:not(.active) { background: #1a1a1a; color: white; }

        /* MAIN CONTENT */
        .main-content { flex-grow: 1; display: flex; padding: 30px; gap: 20px; position: relative; }

        .top-info { position: absolute; top: 20px; right: 40px; display: flex; gap: 15px; z-index: 100; }
        .hud-item {
            background: #151515; padding: 10px 25px; border-radius: 50px;
            border: 1px solid var(--primary-red); font-weight: bold; font-size: 1.1rem;
        }

        /* BET PANEL */
        .bet-panel {
            width: 300px; background: var(--card-bg); padding: 20px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; border: 1px solid #222;
        }
        .display-bet {
            background: #000; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #333;
        }
        .display-bet span { font-size: 1.8rem; color: var(--accent-gold); font-weight: bold; }

        .pill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-pill {
            background: #222; border: 2px solid transparent; color: white; padding: 12px;
            border-radius: var(--pill-radius); cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-pill.selected { border-color: var(--accent-gold); background: #2a2a2a; }

        /* SLIDER BOMBAS */
        .mines-config { background: #000; padding: 15px; border-radius: 15px; border: 1px solid #333; margin-top: 5px; }
        .mines-config label { font-size: 0.8rem; color: #777; display: block; margin-bottom: 10px; }
        .slider { width: 100%; cursor: pointer; accent-color: var(--primary-red); }

        /* GAME AREA */
        .game-area {
            flex-grow: 1; background: #000; border-radius: 25px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid #1a1a1a; overflow: hidden;
        }

        /* MINES GRID */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .mine-btn {
            width: 65px; height: 65px; background: #111; border: 1px solid #222;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: #444; font-size: 1.8rem; transition: 0.2s;
        }
        .mine-btn.revealed-star { background: #1a1a1a; color: var(--accent-gold); border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(241, 196, 15, 0.2); }
        .mine-btn.revealed-bomb { background: #451a1a; border-color: #f00; }

        /* NAVIO */
        #pirate-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ship-container { position: absolute; z-index: 10; width: 70px; }
        .multiplier-text { font-size: 5rem; font-weight: bold; color: var(--accent-gold); z-index: 5; margin-top: -100px; text-shadow: 0 0 20px rgba(241, 196, 15, 0.4); }

        .btn-action {
            width: 100%; padding: 18px; border-radius: var(--pill-radius);
            border: none; background: var(--primary-red); color: white;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-action:disabled { background: #333; cursor: not-allowed; }

        #status-msg { margin-top: 20px; font-weight: bold; font-size: 1.2rem; height: 24px; text-transform: uppercase; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-info">
        <div class="hud-item">$ <span id="balance">1000</span></div>
    </div>

    <nav class="sidebar">
        <h2>REDLUCK</h2>
        <button id="btn-dice" class="active" onclick="setGame('dice')">🎲 DADOS</button>
        <button id="btn-coin" onclick="setGame('coin')">🪙 CARA OU COROA</button>
        <button id="btn-mines" onclick="setGame('mines')">💣 MINES</button>
        <button id="btn-pirate" onclick="setGame('pirate')">🚢 NAVIO PIRATA</button>
    </nav>

    <main class="main-content">
        <section class="bet-panel">
            <div class="display-bet">
                <label style="color:#555; font-size:0.7rem; font-weight:bold">APOSTA</label><br>
                $<span id="bet-amount">0</span>
            </div>
            
            <div class="pill-grid">
                <button class="btn-pill" onclick="modBet(1)">+1</button>
                <button class="btn-pill" onclick="modBet(10)">+10</button>
                <button class="btn-pill" onclick="modBet(50)">+50</button>
                <button class="btn-pill" onclick="modBet(100)">+100</button>
            </div>

            <div id="mines-config-area" class="mines-config hidden">
                <label>BOMBAS: <span id="bomb-count-display" style="color:white">3</span></label>
                <input type="range" min="1" max="24" value="3" class="slider" id="bomb-range" oninput="updateBombDisplay()">
            </div>

            <div id="game-options" class="pill-grid"></div>

            <button id="main-action-btn" class="btn-action" onclick="handleAction()">JOGAR</button>
        </section>

        <section class="game-area">
            <canvas id="pirate-canvas"></canvas>
            <div id="simple-visual" style="font-size: 8rem;">🎲</div>
            <div id="mines-container" class="mines-grid hidden"></div>
            <div id="pirate-scene" class="hidden">
                <div class="multiplier-text" id="crash-mult">1.00x</div>
                <div class="ship-container" id="ship-wrapper">
                    <svg viewBox="0 0 64 64"><path d="M10 40 L54 40 L48 52 L16 52 Z M32 10 L32 40 M32 15 L50 30 L32 30 Z" stroke="white" stroke-width="2" fill="none"/></svg>
                </div>
            </div>
            <div id="status-msg"></div>
        </section>
    </main>

    <script>
        let balance = 1000, bet = 0, currentGame = 'dice', selectedOption = null;
        let isMinesActive = false, mineLocations = [], minesFound = 0;

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance - (isMinesActive ? 0 : bet));
            document.getElementById('bet-amount').innerText = bet;
        }

        function modBet(val) { if (!isMinesActive && balance >= bet + val) { bet += val; updateUI(); } }
        function updateBombDisplay() { document.getElementById('bomb-count-display').innerText = document.getElementById('bomb-range').value; }

        function setGame(game) {
            currentGame = game; isMinesActive = false;
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + game).classList.add('active');
            
            document.getElementById('simple-visual').classList.toggle('hidden', game !== 'dice' && game !== 'coin');
            document.getElementById('mines-container').classList.toggle('hidden', game !== 'mines');
            document.getElementById('mines-config-area').classList.toggle('hidden', game !== 'mines');
            document.getElementById('pirate-scene').classList.toggle('hidden', game !== 'pirate');
            document.getElementById('game-options').classList.toggle('hidden', game === 'mines' || game === 'pirate');
            
            document.getElementById('main-action-btn').innerText = (game === 'pirate') ? "ZARPAR" : (game === 'mines' ? "COMEÇAR" : "JOGAR");
            document.getElementById('status-msg').innerText = "";
            
            if (game === 'mines') initMines();
            else if (game === 'dice' || game === 'coin') setupSimpleOptions(game);
        }

        function setupSimpleOptions(game) {
            const optCont = document.getElementById('game-options'); optCont.innerHTML = "";
            const options = game === 'dice' ? ['Par', 'Ímpar'] : ['Cara', 'Coroa'];
            options.forEach(o => {
                let b = document.createElement('button'); b.className = 'btn-pill'; b.innerText = o;
                b.onclick = () => { selectedOption = o; document.querySelectorAll('#game-options .btn-pill').forEach(btn => btn.classList.remove('selected')); b.classList.add('selected'); };
                optCont.appendChild(b);
            });
        }

        function handleAction() {
            if (bet <= 0) return;
            if (currentGame === 'mines') {
                if (!isMinesActive) startMines(); else cashOutMines();
            } else if (currentGame === 'pirate') {
                // (Lógica do Navio aqui se quiser integrar)
            } else {
                playSimple();
            }
        }

        // --- LÓGICA MINES CORRIGIDA ---
        function initMines() {
            const cont = document.getElementById('mines-container'); cont.innerHTML = "";
            for (let i = 0; i < 25; i++) {
                let b = document.createElement('button'); b.className = 'mine-btn'; b.innerHTML = "★";
                b.dataset.id = i; b.onclick = () => clickMine(i, b); cont.appendChild(b);
            }
        }

        function startMines() {
            const numBombs = parseInt(document.getElementById('bomb-range').value);
            balance -= bet; isMinesActive = true; minesFound = 0;
            mineLocations = [];
            while (mineLocations.length < numBombs) {
                let r = Math.floor(Math.random() * 25);
                if (!mineLocations.includes(r)) mineLocations.push(r);
            }
            document.getElementById('main-action-btn').innerText = "CASH OUT";
            document.getElementById('bomb-range').disabled = true;
            document.getElementById('status-msg').innerText = "BOA SORTE!";
        }

        function clickMine(id, btn) {
            if (!isMinesActive || btn.disabled) return;
            btn.disabled = true;

            if (mineLocations.includes(id)) {
                btn.innerHTML = "💣"; btn.classList.add('revealed-bomb'); gameOverMines();
            } else {
                btn.innerHTML = "★"; btn.classList.add('revealed-star'); minesFound++;
                let mult = calculateMinesMultiplier();
                document.getElementById('status-msg').innerText = `LUCRO: ${(bet * mult).toFixed(2)}`;
            }
        }

        function calculateMinesMultiplier() {
            const n = 25, b = parseInt(document.getElementById('bomb-range').value), h = minesFound;
            // Cálculo simplificado de lucro baseado em probabilidade
            return (1 / ( (n-b)/n * (n-b-1)/(n-1) * (n-b-h+1)/(n-h+1) )) * 0.95; 
        }

        function cashOutMines() {
            if (minesFound === 0) return;
            let win = bet * calculateMinesMultiplier();
            balance += win; endMines(`GANHOU: $${win.toFixed(2)}`, "var(--accent-gold)");
        }

        function gameOverMines() { endMines("BUM! VOCÊ PERDEU.", "#e74c3c"); }

        function endMines(msg, color) {
            isMinesActive = false; document.getElementById('status-msg').innerText = msg;
            document.getElementById('status-msg').style.color = color;
            document.getElementById('main-action-btn').innerText = "COMEÇAR";
            document.getElementById('bomb-range').disabled = false;
            bet = 0; updateUI();
            setTimeout(initMines, 2000);
        }

        function playSimple() {
            if (!selectedOption) return;
            balance -= bet;
            const visual = document.getElementById('simple-visual');
            visual.style.transform = "rotate(360deg)";
            setTimeout(() => {
                visual.style.transform = "rotate(0deg)";
                let res = currentGame === 'dice' ? Math.floor(Math.random() * 6) + 1 : (Math.random() > 0.5 ? 'Cara' : 'Coroa');
                visual.innerText = (currentGame === 'dice') ? res : (res === 'Cara' ? '🌞' : '🌛');
                let won = (currentGame === 'dice') ? (selectedOption === 'Par' && res % 2 === 0 || selectedOption === 'Ímpar' && res % 2 !== 0) : (selectedOption === res);
                if (won) { balance += bet * 2; document.getElementById('status-msg').innerText = "VENCEU!"; } else { document.getElementById('status-msg').innerText = "PERDEU!"; }
                bet = 0; updateUI();
            }, 500);
        }

        setGame('dice'); updateUI();
    </script>
</body>
</html>
