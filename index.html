<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLuck - Cassino Fictício</title>
    <style>
        /* CSS - O Visual do Jogo */
        :root {
            --primary-red: #e74c3c;
            --dark-red: #c0392b;
            --bg-dark: #1a1a1a;
            --hud-bg: #252525;
            --text-white: #ecf0f1;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar - Saldo */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 30px;
            background: var(--hud-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid var(--primary-red);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* HUD Esquerdo - Menu */
        .sidebar {
            width: 200px;
            background-color: var(--hud-bg);
            border-right: 3px solid var(--primary-red);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar button {
            background: transparent;
            border: none;
            color: white;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background: var(--primary-red);
        }

        /* Área Principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            padding: 40px;
            gap: 20px;
        }

        /* HUD de Apostas (Lado Esquerdo da Área Principal) */
        .bet-panel {
            width: 300px;
            background: var(--hud-bg);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-bet {
            background: #333;
            border: 1px solid var(--primary-red);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        .bet-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .btn-value {
            background: #444;
            border: none;
            color: white;
            padding: 5px;
            cursor: pointer;
        }

        .btn-roll {
            background: var(--primary-red);
            border: none;
            color: white;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Área do Jogo (Direita) */
        .game-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #222;
            border-radius: 10px;
        }

        #dice-result {
            font-size: 8rem;
            margin-bottom: 20px;
        }

        .status-msg {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .win { color: #2ecc71; }
        .lose { color: var(--primary-red); }
    </style>
</head>
<body>

    <div class="top-bar">
        Saldo: $<span id="balance">1000</span>
    </div>

    <nav class="sidebar">
        <button onclick="alert('Já estamos em Dados!')">🎲 Dados</button>
        <button onclick="alert('Em breve: Cara ou Coroa')">🪙 Cara ou Coroa</button>
    </nav>

    <main class="main-content">
        <section class="bet-panel">
            <h3>Apostar em Dados</h3>
            
            <label>Valor da Aposta:</label>
            <input type="number" id="bet-amount" class="input-bet" value="10">
            
            <div class="bet-buttons">
                <button class="btn-value" onclick="setBet(1)">1</button>
                <button class="btn-value" onclick="setBet(5)">5</button>
                <button class="btn-value" onclick="setBet(10)">10</button>
                <button class="btn-value" onclick="setBet(100)">100</button>
            </div>

            <label>Tipo de Aposta:</label>
            <select id="bet-type" class="input-bet">
                <option value="even">Pares (2x)</option>
                <option value="odd">Ímpares (2x)</option>
                <option value="1">Número 1 (5x)</option>
                <option value="2">Número 2 (5x)</option>
                <option value="3">Número 3 (5x)</option>
                <option value="4">Número 4 (5x)</option>
                <option value="5">Número 5 (5x)</option>
                <option value="6">Número 6 (5x)</option>
            </select>

            <button class="btn-roll" onclick="playDice()">ROLAR DADOS</button>
        </section>

        <section class="game-display">
            <div id="dice-result">🎲</div>
            <div id="status" class="status-msg">Boa sorte!</div>
        </section>
    </main>

    <script>
        // Lógica do Jogo
        let balance = 1000;

        function setBet(val) {
            document.getElementById('bet-amount').value = val;
        }

        function playDice() {
            const betAmount = parseInt(document.getElementById('bet-amount').value);
            const betType = document.getElementById('bet-type').value;
            const statusEl = document.getElementById('status');
            const diceEl = document.getElementById('dice-result');

            if (betAmount > balance) {
                alert("Saldo insuficiente!");
                return;
            }

            // Tirar número aleatório entre 1 e 6
            const result = Math.floor(Math.random() * 6) + 1;
            diceEl.innerText = result;
            
            balance -= betAmount; // Tira o dinheiro da aposta
            let won = false;
            let multiplier = 0;

            // Lógica de Ganho
            if (betType === 'even' && result % 2 === 0) {
                won = true;
                multiplier = 2;
            } else if (betType === 'odd' && result % 2 !== 0) {
                won = true;
                multiplier = 2;
            } else if (parseInt(betType) === result) {
                won = true;
                multiplier = 5;
            }

            if (won) {
                const prize = betAmount * multiplier;
                balance += prize;
                statusEl.innerText = `VOCÊ GANHOU $${prize}!`;
                statusEl.className = "status-msg win";
            } else {
                statusEl.innerText = "VOCÊ PERDEU!";
                statusEl.className = "status-msg lose";
            }

            document.getElementById('balance').innerText = balance;
        }
    </script>
</body>
</html>
