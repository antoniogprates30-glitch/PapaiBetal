<section class="bet-panel">
    <div class="bet-section">
        <label class="section-label">VALOR DA APOSTA</label>
        <div class="display-bet">
            $<span id="bet-amount">0</span>
        </div>
        <div class="pill-grid">
            <button class="btn-pill" onclick="modBet(1)">+1</button>
            <button class="btn-pill" onclick="modBet(10)">+10</button>
            <button class="btn-pill" onclick="modBet(50)">+50</button>
            <button class="btn-pill" onclick="modBet(100)">+100</button>
        </div>
        <button class="btn-pill" style="width: 100%; margin-top: 5px; background: #333;" onclick="resetBet()">LIMPAR</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">

    <div id="mines-config-area" class="mines-config hidden">
        <label class="section-label">BOMBAS: <span id="bomb-count-display" style="color:white">3</span></label>
        <input type="range" min="1" max="24" value="3" class="slider" id="bomb-range" oninput="updateBombDisplay()">
    </div>

    <div id="dice-options-area">
        <label class="section-label">TIPO DE APOSTA (PAR/ÍMPAR)</label>
        <div id="game-options" class="pill-grid">
            </div>

        <label class="section-label" style="margin-top: 15px;">OU NÚMERO ESPECÍFICO</label>
        <div id="number-options" class="pill-grid" style="grid-template-columns: repeat(3, 1fr);">
            <button class="btn-pill btn-num" onclick="selectSpecific(1)">1</button>
            <button class="btn-pill btn-num" onclick="selectSpecific(2)">2</button>
            <button class="btn-pill btn-num" onclick="selectSpecific(3)">3</button>
            <button class="btn-pill btn-num" onclick="selectSpecific(4)">4</button>
            <button class="btn-pill btn-num" onclick="selectSpecific(5)">5</button>
            <button class="btn-pill btn-num" onclick="selectSpecific(6)">6</button>
        </div>
    </div>

    <button id="main-action-btn" class="btn-action" style="margin-top: 10px;" onclick="handleAction()">JOGAR</button>
</section>

<style>
    /* Adicionando estilos para os rótulos de seção */
    .section-label {
        font-size: 0.65rem;
        color: #777;
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-num { font-size: 1.1rem; }
</style>

<script>
    let balance = 1000, bet = 0, currentGame = 'dice', selectedOption = null;
    let isMinesActive = false, mineLocations = [], minesFound = 0;

    function updateUI() {
        document.getElementById('balance').innerText = Math.floor(balance);
        document.getElementById('bet-amount').innerText = bet;
    }

    function modBet(val) { 
        if (!isMinesActive && balance >= bet + val) { 
            bet += val; updateUI(); 
        } 
    }
    
    function resetBet() { if(!isMinesActive) { bet = 0; updateUI(); } }

    function updateBombDisplay() { 
        document.getElementById('bomb-count-display').innerText = document.getElementById('bomb-range').value; 
    }

    // Seleção para números específicos (1-6)
    function selectSpecific(num) {
        selectedOption = num;
        clearSelections();
        const btns = document.querySelectorAll('#number-options .btn-pill');
        btns[num-1].classList.add('selected');
    }

    function clearSelections() {
        document.querySelectorAll('.btn-pill').forEach(btn => btn.classList.remove('selected'));
    }

    function setGame(game) {
        currentGame = game; isMinesActive = false;
        document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + game).classList.add('active');
        
        document.getElementById('simple-visual').classList.toggle('hidden', game !== 'dice');
        document.getElementById('mines-container').classList.toggle('hidden', game !== 'mines');
        document.getElementById('mines-config-area').classList.toggle('hidden', game !== 'mines');
        document.getElementById('dice-options-area').classList.toggle('hidden', game !== 'dice');
        
        document.getElementById('main-action-btn').innerText = (game === 'mines' ? "COMEÇAR" : "JOGAR");
        document.getElementById('status-msg').innerText = "";
        
        if (game === 'mines') initMines();
        else setupSimpleOptions();
    }

    function setupSimpleOptions() {
        const optCont = document.getElementById('game-options'); 
        optCont.innerHTML = "";
        ['Par', 'Ímpar'].forEach(o => {
            let b = document.createElement('button');
            b.className = 'btn-pill';
            b.innerText = o;
            b.onclick = () => { 
                selectedOption = o; 
                clearSelections();
                b.classList.add('selected'); 
            };
            optCont.appendChild(b);
        });
    }

    function handleAction() {
        if (bet <= 0) return;
        if (currentGame === 'mines') {
            if (!isMinesActive) startMines(); else cashOutMines();
        } else {
            playDice();
        }
    }

    /* LOGICA DADOS ATUALIZADA */
    function playDice() {
        if (selectedOption === null) {
            document.getElementById('status-msg').innerText = "Escolha onde apostar!";
            return;
        }
        
        const visual = document.getElementById('simple-visual');
        visual.style.transform = "rotate(720deg)";
        
        setTimeout(() => {
            visual.style.transform = "rotate(0deg)";
            let res = Math.floor(Math.random() * 6) + 1;
            const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            visual.innerText = diceFaces[res-1];
            
            let won = false;
            let multiplier = 1.95; // Multiplicador para Par/Ímpar

            if (typeof selectedOption === 'number') {
                won = (res === selectedOption);
                multiplier = 5.70; // Multiplicador maior para número exato (6x menos margem da casa)
            } else {
                won = (selectedOption === 'Par' && res % 2 === 0) || (selectedOption === 'Ímpar' && res % 2 !== 0);
            }
            
            if (won) {
                let profit = bet * (multiplier - 1);
                balance += profit;
                document.getElementById('status-msg').innerText = `VENCEU! +$${(bet * multiplier).toFixed(2)}`;
                document.getElementById('status-msg').style.color = "var(--accent-gold)";
            } else {
                balance -= bet;
                document.getElementById('status-msg').innerText = "PERDEU!";
                document.getElementById('status-msg').style.color = "var(--primary-red)";
            }
            
            bet = 0;
            updateUI();
        }, 600);
    }
