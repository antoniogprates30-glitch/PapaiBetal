<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazulu - Miles Morales Edition</title>
    <style>
        :root {
            --spider-red: #e62429;
            --spider-black: #121212;
            --spider-blue: #001df5;
            --gold: #ffd700;
        }

        body {
            background-color: var(--spider-black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            min-height: 100vh;
        }

        h1 {
            color: var(--spider-red);
            text-shadow: 3px 3px 0px var(--spider-blue), 5px 5px 15px rgba(230, 36, 41, 0.5);
            font-size: 3rem;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        /* HUD DE SALDO E APOSTA */
        .hud {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid var(--spider-red);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(230, 36, 41, 0.2);
        }

        .balance { font-size: 1.5rem; color: var(--gold); margin-bottom: 10px; }
        .bet-display { font-size: 1.2rem; margin-bottom: 15px; }

        /* BOTÕES ARREDONDADOS */
        .bet-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .btn-bet {
            background: var(--spider-black);
            border: 2px solid var(--spider-blue);
            color: white;
            padding: 10px 20px;
            border-radius: 50px; /* ARREDONDADO */
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-bet:hover { background: var(--spider-blue); transform: scale(1.1); }
        .btn-clear { border-color: #ff4444; color: #ff4444; }

        /* NAVEGAÇÃO DE JOGOS */
        .game-nav { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 10px;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--spider-red); border-bottom: 2px solid var(--spider-red); }

        .game-container { display: none; text-align: center; width: 100%; max-width: 500px; }
        .game-container.active { display: block; }

        /* JOGO 1: DADOS */
        .dice-area { font-size: 5rem; margin: 20px; min-height: 100px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .opt-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        .opt-btn.selected { border-color: var(--spider-red); background: rgba(230, 36, 41, 0.2); }

        /* JOGO 2: CARA OU COROA */
        .coin {
            width: 120px;
            height: 120px;
            background: var(--gold);
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            border: 5px solid #b8860b;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flipping { animation: flip 0.2s infinite; }
        @keyframes flip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }

        /* JOGO 3: ARANHAS (MINES) */
        .grid-5x5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 20px auto;
            width: 300px;
        }
        .cell {
            width: 55px;
            height: 55px;
            background: #222;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .cell.safe { background: var(--spider-blue); }
        .cell.spider { background: var(--spider-red); }

        /* CONFETES/TEIAS ANIMATION */
        #fx-canvas {
            position: fixed;
            top: 0; left: 0; pointer-events: none;
            z-index: 999;
        }

        .action-btn {
            background: var(--spider-red);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(230, 36, 41, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <h1>KAZULU</h1>

    <div class="hud">
        <div class="balance">Saldo: R$ <span id="balance">500.00</span></div>
        <div class="bet-display">Aposta Atual: <strong>R$ <span id="current-bet">0</span></strong></div>
        
        <div class="bet-buttons">
            <button class="btn-bet" onclick="addBet(1)">+1</button>
            <button class="btn-bet" onclick="addBet(5)">+5</button>
            <button class="btn-bet" onclick="addBet(10)">+10</button>
            <button class="btn-bet" onclick="addBet(100)">+100</button>
            <button class="btn-bet btn-clear" onclick="clearBet()">Limpar</button>
        </div>
    </div>

    <div class="game-nav">
        <button class="tab-btn active" onclick="switchGame('dice')">Dados (2x-6x)</button>
        <button class="tab-btn" onclick="switchGame('coin')">Cara/Coroa (5x)</button>
        <button class="tab-btn" onclick="switchGame('spiders')">Aranhas (Multi)</button>
    </div>

    <div id="game-dice" class="game-container active">
        <div class="dice-area" id="dice-display">🎲</div>
        <div class="options-grid">
            <button class="opt-btn" onclick="selectOpt('par', this)">PAR (2x)</button>
            <button class="opt-btn" onclick="selectOpt('impar', this)">ÍMPAR (2x)</button>
            <button class="opt-btn" onclick="selectOpt('6', this)">NÚMERO 6 (6x)</button>
            <button class="opt-btn" onclick="selectOpt('1', this)">NÚMERO 1 (6x)</button>
        </div>
        <button class="action-btn" onclick="playDice()">LANÇAR DADOS</button>
    </div>

    <div id="game-coin" class="game-container">
        <div class="coin" id="coin-element">?</div>
        <div class="options-grid">
            <button class="opt-btn" onclick="selectOpt('cara', this)">CARA (5x)</button>
            <button class="opt-btn" onclick="selectOpt('coroa', this)">COROA (5x)</button>
        </div>
        <button class="action-btn" onclick="playCoin()">GIRAR MOEDA</button>
    </div>

    <div id="game-spiders" class="game-container">
        <p>Bombas (Aranhas): <input type="range" id="bomb-range" min="1" max="20" value="5" oninput="updateMinesInfo()"> <span id="bomb-count">5</span></p>
        <p>Multiplicador Atual: <span id="mines-multi" style="color:var(--gold)">1.2x</span></p>
        <div class="grid-5x5" id="mines-grid"></div>
        <button class="action-btn" onclick="startMines()">COMEÇAR NOVO TABULEIRO</button>
    </div>

    <script>
        let balance = 500;
        let currentBet = 0;
        let selectedOption = null;
        const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        // Sistema de Aposta Somada
        function addBet(val) {
            currentBet += val;
            document.getElementById('current-bet').innerText = currentBet;
        }

        function clearBet() {
            currentBet = 0;
            document.getElementById('current-bet').innerText = 0;
        }

        function selectOpt(opt, btn) {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedOption = opt;
        }

        function switchGame(game) {
            document.querySelectorAll('.game-container').forEach(g => g.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('game-' + game).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Lógica de Dados com Animação
        function playDice() {
            if (currentBet <= 0 || !selectedOption) return alert("Aposte e escolha uma opção!");
            if (currentBet > balance) return alert("Saldo insuficiente!");

            balance -= currentBet;
            updateBalance();

            let counter = 0;
            const interval = setInterval(() => {
                document.getElementById('dice-display').innerText = diceIcons[Math.floor(Math.random()*6)];
                counter++;
                if(counter > 10) {
                    clearInterval(interval);
                    finishDice();
                }
            }, 100);
        }

        function finishDice() {
            const result = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-display').innerText = diceIcons[result-1];
            
            let win = false;
            if(selectedOption === 'par' && result % 2 === 0) win = true;
            if(selectedOption === 'impar' && result % 2 !== 0) win = true;
            if(selectedOption == result) win = true;

            if(win) {
                let mult = (selectedOption === 'par' || selectedOption === 'impar') ? 2 : 6;
                winAction(currentBet * mult);
            }
        }

        // Lógica de Moeda
        function playCoin() {
            if (currentBet <= 0 || !selectedOption) return alert("Aposte e escolha Cara ou Coroa!");
            const coin = document.getElementById('coin-element');
            coin.classList.add('flipping');
            
            balance -= currentBet;
            updateBalance();

            setTimeout(() => {
                coin.classList.remove('flipping');
                const res = Math.random() > 0.5 ? 'cara' : 'coroa';
                coin.innerText = res.toUpperCase();
                if(selectedOption === res) winAction(currentBet * 5);
            }, 1500);
        }

        // Lógica de Aranhas (Mines)
        let minePositions = [];
        let minesActive = false;
        function updateMinesInfo() {
            document.getElementById('bomb-count').innerText = document.getElementById('bomb-range').value;
        }

        function startMines() {
            if (currentBet <= 0) return alert("Defina a aposta!");
            const bombCount = parseInt(document.getElementById('bomb-range').value);
            minePositions = [];
            while(minePositions.length < bombCount) {
                let r = Math.floor(Math.random() * 25);
                if(!minePositions.includes(r)) minePositions.push(r);
            }
            
            const grid = document.getElementById('mines-grid');
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => revealMine(i, cell);
                grid.appendChild(cell);
            }
            balance -= currentBet;
            updateBalance();
            minesActive = true;
        }

        function revealMine(idx, element) {
            if(!minesActive) return;
            if(minePositions.includes(idx)) {
                element.innerHTML = '🕷️';
                element.classList.add('spider');
                minesActive = false;
                alert("Uma aranha te pegou!");
            } else {
                element.innerHTML = '🕸️';
                element.classList.add('safe');
                // Simulação de ganho progressivo
                winAction(currentBet * 0.2, true); 
            }
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function winAction(amount, silent = false) {
            balance += amount;
            updateBalance();
            if(!silent) {
                spawnWebs();
                alert("VOCÊ GANHOU R$ " + amount.toFixed(2));
            }
        }

        // Efeito de Teias/Confetes
        function spawnWebs() {
            const canvas = document.getElementById('fx-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            for(let i=0; i<30; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width/2, canvas.height/2);
                ctx.lineTo(Math.random()*canvas.width, Math.random()*canvas.height);
                ctx.strokeStyle = "white";
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
            setTimeout(() => ctx.clearRect(0,0,canvas.width, canvas.height), 1000);
        }
    </script>
</body>
</html>
