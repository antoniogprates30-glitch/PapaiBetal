<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLuck - Pirate & Casino Edition</title>
    <style>
        :root {
            --primary-red: #e74c3c;
            --accent-gold: #f1c40f;
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --pill-radius: 50px;
            --fire-color: #ff6600;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark); color: white;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px; background: #151515; border-right: 2px solid #222;
            display: flex; flex-direction: column; padding: 20px; gap: 10px;
        }
        .sidebar h2 { color: var(--primary-red); text-align: center; letter-spacing: 2px; margin-bottom: 20px; }
        .sidebar button {
            background: transparent; border: none; color: #777; padding: 12px;
            text-align: left; cursor: pointer; border-radius: 12px; transition: 0.3s;
            font-weight: bold; font-size: 0.9rem;
        }
        .sidebar button.active { background: var(--primary-red); color: white; }
        .sidebar button:hover:not(.active) { background: #222; color: white; }

        /* MAIN CONTENT */
        .main-content { flex-grow: 1; display: flex; padding: 30px; gap: 20px; position: relative; }

        /* HUD & BALANCE */
        .top-info {
            position: absolute; top: 20px; right: 40px; display: flex; gap: 15px; z-index: 100;
        }
        .hud-item {
            background: #1a1a1a; padding: 10px 25px; border-radius: 50px;
            border: 2px solid var(--primary-red); font-weight: bold; font-size: 1.2rem;
        }
        .streak-badge {
            border-color: var(--fire-color); color: var(--fire-color); display: none;
            animation: glow 1s infinite alternate;
        }

        /* BET PANEL */
        .bet-panel {
            width: 320px; background: #1a1a1a; padding: 20px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; border: 1px solid #333;
            z-index: 10;
        }
        .display-bet {
            background: #000; padding: 15px; border-radius: 15px; text-align: center;
            border: 1px solid #444;
        }
        .display-bet span { font-size: 1.8rem; color: var(--accent-gold); font-weight: bold; }

        .pill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-pill {
            background: #333; border: 2px solid transparent; color: white; padding: 10px;
            border-radius: var(--pill-radius); cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-pill:hover { background: #444; }
        .btn-pill.selected { 
            border-color: var(--accent-gold); 
            background: #444; 
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }
        .btn-clear { background: #c0392b; grid-column: span 2; }

        /* GAME AREA */
        .game-area {
            flex-grow: 1; background: #111; border-radius: 25px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #222; overflow: hidden;
        }

        /* MINES GRID */
        .mines-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
        }

        /* PIRATE SHIP (CSS & SVG) */
        #pirate-scene {
            display: none; flex-direction: column; align-items: center; width: 100%; height: 300px; position: relative;
        }
        .ship-container {
            position: absolute; bottom: 20px; transition: all 0.1s linear;
        }
        .ship-svg {
            width: 100px; fill: white; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }
        .sea { 
            position: absolute; bottom: 0; width: 100%; height: 15px; 
            background: linear-gradient(transparent, #2980b9); border-radius: 10px; 
        }
        .multiplier-text { font-size: 5rem; font-weight: bold; color: var(--accent-gold); z-index: 5; margin-bottom: 50px; }

        /* DICE ANIMATION */
        .dice-roll { animation: roll 0.5s infinite; }
        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-action {
            width: 100%; padding: 15px; border-radius: var(--pill-radius);
            border: none; background: var(--primary-red); color: white;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { background: #444; cursor: not-allowed; }

        @keyframes glow {
            from { box-shadow: 0 0 5px var(--fire-color); }
            to { box-shadow: 0 0 20px var(--fire-color); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-info">
        <div id="streak-indicator" class="hud-item streak-badge">🔥 STREAK: <span id="streak-val">0</span></div>
        <div class="hud-item">$ <span id="balance">1000</span></div>
    </div>

    <nav class="sidebar">
        <h2>REDLUCK</h2>
        <button id="btn-dice" class="active" onclick="setGame('dice')">🎲 Dados</button>
        <button id="btn-coin" onclick="setGame('coin')">🪙 Cara ou Coroa</button>
        <button id="btn-mines" onclick="setGame('mines')">💣 Mines</button>
        <button id="btn-pirate" onclick="setGame('pirate')">🚢 Navio Pirata</button>
        <button id="btn-luck" class="hidden" onclick="setGame('luck')" style="color:var(--accent-gold)">🎡 Roda LUCK</button>
    </nav>

    <main class="main-content">
        <section class="bet-panel">
            <div class="display-bet">
                <label style="color:#666; font-size:0.7rem">APOSTA ATUAL</label><br>
                $<span id="bet-amount">0</span>
            </div>
            
            <div class="pill-grid">
                <button class="btn-pill" onclick="modBet(1)">+1</button>
                <button class="btn-pill" onclick="modBet(10)">+10</button>
                <button class="btn-pill" onclick="modBet(50)">+50</button>
                <button class="btn-pill" onclick="modBet(100)">+100</button>
                <button class="btn-pill btn-clear" onclick="clearBet()">Zerar</button>
            </div>

            <div id="game-options" class="pill-grid">
                </div>

            <button id="main-action-btn" class="btn-action" onclick="handleAction()">JOGAR</button>
        </section>

        <section class="game-area">
            <div id="simple-visual" style="font-size: 8rem; transition: 0.3s;">🎲</div>

            <div id="mines-container" class="mines-grid hidden"></div>

            <div id="pirate-scene">
                <div class="multiplier-text" id="crash-mult">1.00x</div>
                <div class="ship-container" id="ship-wrapper">
                    <svg class="ship-svg" viewBox="0 0 64 64">
                        <path d="M10 40 L54 40 L48 52 L16 52 Z M32 10 L32 40 M32 15 L50 30 L32 30 Z" stroke="white" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="sea"></div>
            </div>

            <div id="status-msg" style="margin-top: 20px; font-weight: bold; font-size: 1.5rem; height: 30px;"></div>
        </section>
    </main>

    <script>
        let balance = 1000;
        let bet = 0;
        let currentGame = 'dice';
        let streak = 0;
        let selectedOption = null;
        
        let crashInterval;
        let currentMult = 1.0;
        let isPlayingCrash = false;

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance - bet);
            document.getElementById('bet-amount').innerText = bet;
            const streakBadge = document.getElementById('streak-indicator');
            if(streak >= 3) {
                streakBadge.style.display = 'block';
                document.getElementById('streak-val').innerText = streak;
            } else {
                streakBadge.style.display = 'none';
            }
        }

        function modBet(val) {
            if (balance >= bet + val) { bet += val; updateUI(); }
        }

        function clearBet() { bet = 0; updateUI(); }

        function selectGameOption(opt, btn) {
            selectedOption = opt;
            document.querySelectorAll('#game-options .btn-pill').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function setGame(game) {
            currentGame = game;
            selectedOption = null;
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + game).classList.add('active');
            
            // Reset Visuals
            document.getElementById('simple-visual').classList.add('hidden');
            document.getElementById('mines-container').classList.add('hidden');
            document.getElementById('pirate-scene').style.display = 'none';
            document.getElementById('status-msg').innerText = "";
            document.getElementById('main-action-btn').innerText = "JOGAR";
            
            const optCont = document.getElementById('game-options');
            optCont.innerHTML = "";

            if(game === 'dice' || game === 'coin') {
                document.getElementById('simple-visual').classList.remove('hidden');
                document.getElementById('simple-visual').innerText = game === 'dice' ? '🎲' : '🪙';
                const options = game === 'dice' ? ['Par', 'Ímpar'] : ['Cara', 'Coroa'];
                options.forEach(o => {
                    let b = document.createElement('button');
                    b.className = 'btn-pill'; b.innerText = o;
                    b.onclick = () => selectGameOption(o, b);
                    optCont.appendChild(b);
                });
            } else if(game === 'pirate') {
                document.getElementById('pirate-scene').style.display = 'flex';
                document.getElementById('main-action-btn').innerText = "ZARPAR";
                document.getElementById('crash-mult').innerText = "1.00x";
                resetShip();
            } else if(game === 'mines') {
                document.getElementById('mines-container').classList.remove('hidden');
                initMines();
            }
        }

        function handleAction() {
            if(bet <= 0) return showStatus("Aposte um valor!", "yellow");

            if(currentGame === 'pirate') {
                if(!isPlayingCrash) startCrash();
                else stopCrash();
            } else if(currentGame === 'dice' || currentGame === 'coin') {
                playSimpleGame();
            }
        }

        function showStatus(msg, color) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.color = color || "white";
        }

        // --- PIRATE CRASH REFEITO ---
        function resetShip() {
            const ship = document.getElementById('ship-wrapper');
            ship.style.bottom = "20px";
            ship.style.left = "20px";
            ship.style.transform = "rotate(0deg)";
        }

        function startCrash() {
            isPlayingCrash = true;
            currentMult = 1.0;
            balance -= bet;
            document.getElementById('main-action-btn').innerText = "RESGATAR";
            showStatus("Navegando...", "#3498db");
            
            let crashPoint = (Math.random() * 4 + 1.1); 

            crashInterval = setInterval(() => {
                currentMult += 0.01;
                document.getElementById('crash-mult').innerText = currentMult.toFixed(2) + "x";
                
                // Movimento Logarítmico (Sobe aos poucos)
                const ship = document.getElementById('ship-wrapper');
                const x = (currentMult - 1) * 80; // Avanço lateral
                const y = Math.log(currentMult) * 150; // Subida logarítmica
                const tilt = Math.sin(currentMult * 10) * 5; // Balanço suave

                ship.style.left = `calc(20px + ${x}px)`;
                ship.style.bottom = `calc(20px + ${y}px)`;
                ship.style.transform = `rotate(${tilt}deg)`;

                if(currentMult >= crashPoint) {
                    gameOverCrash();
                }
            }, 50);
        }

        function stopCrash() {
            clearInterval(crashInterval);
            isPlayingCrash = false;
            let win = bet * currentMult;
            balance += win;
            streak++;
            showStatus(`TESOURO: $${win.toFixed(2)}`, "#2ecc71");
            document.getElementById('main-action-btn').innerText = "ZARPAR";
            bet = 0;
            updateUI();
        }

        function gameOverCrash() {
            clearInterval(crashInterval);
            isPlayingCrash = false;
            streak = 0;
            showStatus("O NAVIO AFUNDOU!", "#e74c3c");
            document.getElementById('ship-wrapper').style.transform = "scale(0) rotate(180deg)";
            setTimeout(() => {
                resetShip();
                document.getElementById('ship-wrapper').style.transform = "scale(1)";
            }, 1000);
            document.getElementById('main-action-btn').innerText = "ZARPAR";
            bet = 0;
            updateUI();
        }

        // --- DADOS E MOEDA ---
        function playSimpleGame() {
            if(!selectedOption) return showStatus("Selecione uma opção!", "yellow");
            
            const visual = document.getElementById('simple-visual');
            visual.classList.add('dice-roll');
            
            setTimeout(() => {
                visual.classList.remove('dice-roll');
                balance -= bet;
                
                let win = false;
                if(currentGame === 'dice') {
                    let res = Math.floor(Math.random() * 6) + 1;
                    visual.innerText = res;
                    win = (selectedOption === 'Par' && res % 2 === 0) || (selectedOption === 'Ímpar' && res % 2 !== 0);
                } else {
                    let res = Math.random() > 0.5 ? 'Cara' : 'Coroa';
                    visual.innerText = res === 'Cara' ? '🌞' : '🌛';
                    win = (selectedOption === res);
                }

                if(win) {
                    let prize = bet * 2;
                    balance += prize;
                    streak++;
                    showStatus("GANHOU! +$" + prize, "#2ecc71");
                } else {
                    streak = 0;
                    showStatus("PERDEU!", "#e74c3c");
                }
                bet = 0;
                updateUI();
            }, 600);
        }

        function initMines() {
            const cont = document.getElementById('mines-container');
            cont.innerHTML = "";
            for(let i=0; i<25; i++) {
                let b = document.createElement('button');
                b.className = 'mine-btn';
                b.innerText = "❓";
                b.onclick = () => showStatus("Mecânica Mines em breve!", "#f1c40f");
                cont.appendChild(b);
            }
        }

        setGame('dice');
        updateUI();
    </script>
</body>
</html>
