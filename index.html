<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedLuck - Pirate Edition</title>
    <style>
        :root {
            --primary-red: #e74c3c;
            --accent-gold: #f1c40f;
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
            --pill-radius: 50px;
        }

        body {
            margin: 0; font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark); color: white;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px; background: #111; border-right: 1px solid #222;
            display: flex; flex-direction: column; padding: 25px; gap: 10px;
        }
        .sidebar h2 { color: var(--primary-red); text-align: center; letter-spacing: 3px; margin-bottom: 30px; }
        .sidebar button {
            background: transparent; border: none; color: #555; padding: 14px;
            text-align: left; cursor: pointer; border-radius: 12px; transition: 0.3s;
            font-weight: bold; font-size: 0.95rem;
        }
        .sidebar button.active { background: var(--primary-red); color: white; }
        .sidebar button:hover:not(.active) { background: #1a1a1a; color: white; }

        /* MAIN CONTENT */
        .main-content { flex-grow: 1; display: flex; padding: 30px; gap: 20px; position: relative; }

        /* HUD */
        .top-info { position: absolute; top: 20px; right: 40px; display: flex; gap: 15px; z-index: 100; }
        .hud-item {
            background: #151515; padding: 10px 25px; border-radius: 50px;
            border: 1px solid var(--primary-red); font-weight: bold; font-size: 1.1rem;
        }

        /* BET PANEL */
        .bet-panel {
            width: 300px; background: var(--card-bg); padding: 20px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 15px; border: 1px solid #222;
        }
        .display-bet {
            background: #000; padding: 15px; border-radius: 15px; text-align: center;
            border: 1px solid #333;
        }
        .display-bet span { font-size: 1.8rem; color: var(--accent-gold); font-weight: bold; }

        .pill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-pill {
            background: #222; border: 2px solid transparent; color: white; padding: 12px;
            border-radius: var(--pill-radius); cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-pill.selected { border-color: var(--accent-gold); background: #2a2a2a; }
        .btn-clear { background: #8e1e13; grid-column: span 2; margin-top: 5px; }

        /* GAME AREA */
        .game-area {
            flex-grow: 1; background: #000; border-radius: 25px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid #1a1a1a; overflow: hidden;
        }

        /* MINES DESIGN CORRIGIDO */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .mine-btn {
            width: 60px; height: 60px; background: #111; border: 1px solid #222;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: #444; font-size: 1.5rem; transition: 0.2s;
        }
        .mine-btn:hover { border-color: #555; background: #151515; }

        /* NAVIO E TRAJETÓRIA */
        #pirate-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ship-container { position: absolute; z-index: 10; width: 70px; transition: transform 0.1s linear; }
        .multiplier-text { font-size: 5rem; font-weight: bold; color: var(--accent-gold); z-index: 5; margin-top: -100px; }

        .btn-action {
            width: 100%; padding: 18px; border-radius: var(--pill-radius);
            border: none; background: var(--primary-red); color: white;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.96); }

        .hidden { display: none !important; }
        #status-msg { margin-top: 20px; font-weight: bold; font-size: 1.2rem; height: 24px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="top-info">
        <div class="hud-item">$ <span id="balance">1000</span></div>
    </div>

    <nav class="sidebar">
        <h2>REDLUCK</h2>
        <button id="btn-dice" class="active" onclick="setGame('dice')">🎲 DADOS</button>
        <button id="btn-coin" onclick="setGame('coin')">🪙 CARA OU COROA</button>
        <button id="btn-mines" onclick="setGame('mines')">💣 MINES</button>
        <button id="btn-pirate" onclick="setGame('pirate')">🚢 NAVIO PIRATA</button>
    </nav>

    <main class="main-content">
        <section class="bet-panel">
            <div class="display-bet">
                <label style="color:#555; font-size:0.7rem; font-weight:bold">APOSTA</label><br>
                $<span id="bet-amount">0</span>
            </div>
            
            <div class="pill-grid">
                <button class="btn-pill" onclick="modBet(1)">+1</button>
                <button class="btn-pill" onclick="modBet(10)">+10</button>
                <button class="btn-pill" onclick="modBet(50)">+50</button>
                <button class="btn-pill" onclick="modBet(100)">+100</button>
                <button class="btn-pill btn-clear" onclick="clearBet()">ZERAR</button>
            </div>

            <div id="game-options" class="pill-grid"></div>

            <button id="main-action-btn" class="btn-action" onclick="handleAction()">JOGAR</button>
        </section>

        <section class="game-area">
            <canvas id="pirate-canvas"></canvas>
            
            <div id="simple-visual" style="font-size: 8rem;">🎲</div>

            <div id="mines-container" class="mines-grid hidden"></div>

            <div id="pirate-scene" class="hidden" style="flex-direction: column; align-items: center; width: 100%; height: 100%;">
                <div class="multiplier-text" id="crash-mult">1.00x</div>
                <div class="ship-container" id="ship-wrapper">
                    <svg viewBox="0 0 64 64"><path d="M10 40 L54 40 L48 52 L16 52 Z M32 10 L32 40 M32 15 L50 30 L32 30 Z" stroke="white" stroke-width="2" fill="none"/></svg>
                </div>
            </div>

            <div id="status-msg"></div>
        </section>
    </main>

    <script>
        let balance = 1000, bet = 0, currentGame = 'dice', selectedOption = null;
        let crashInterval, currentMult = 1.0, isPlayingCrash = false, points = [];

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance - bet);
            document.getElementById('bet-amount').innerText = bet;
        }

        function modBet(val) { if (balance >= bet + val) { bet += val; updateUI(); } }
        function clearBet() { bet = 0; updateUI(); }

        function setGame(game) {
            currentGame = game; selectedOption = null;
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + game).classList.add('active');
            
            document.getElementById('simple-visual').classList.add('hidden');
            document.getElementById('mines-container').classList.add('hidden');
            document.getElementById('pirate-scene').classList.add('hidden');
            document.getElementById('status-msg').innerText = "";
            document.getElementById('main-action-btn').innerText = (game === 'pirate') ? "ZARPAR" : "JOGAR";
            
            const optCont = document.getElementById('game-options');
            optCont.innerHTML = "";

            if(game === 'dice' || game === 'coin') {
                document.getElementById('simple-visual').classList.remove('hidden');
                document.getElementById('simple-visual').innerText = game === 'dice' ? '🎲' : '🪙';
                const options = game === 'dice' ? ['Par', 'Ímpar'] : ['Cara', 'Coroa'];
                options.forEach(o => {
                    let b = document.createElement('button');
                    b.className = 'btn-pill'; b.innerText = o;
                    b.onclick = () => {
                        selectedOption = o;
                        document.querySelectorAll('#game-options .btn-pill').forEach(btn => btn.classList.remove('selected'));
                        b.classList.add('selected');
                    };
                    optCont.appendChild(b);
                });
            } else if(game === 'pirate') {
                document.getElementById('pirate-scene').classList.remove('hidden');
                resetPirate();
            } else if(game === 'mines') {
                document.getElementById('mines-container').classList.remove('hidden');
                initMines();
            }
        }

        function handleAction() {
            if(bet <= 0) return;
            if(currentGame === 'pirate') {
                if(!isPlayingCrash) startCrash(); else stopCrash();
            } else {
                playSimple();
            }
        }

        // --- PIRATE LOGIC ---
        function resetPirate() {
            currentMult = 1.0; points = [];
            document.getElementById('crash-mult').innerText = "1.00x";
            const canvas = document.getElementById('pirate-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const ship = document.getElementById('ship-wrapper');
            ship.style.left = "50px"; ship.style.bottom = "50px"; ship.style.top = "auto";
        }

        function drawTrail() {
            const canvas = document.getElementById('pirate-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3; ctx.beginPath();
            points.forEach((p, i) => { if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
        }

        function startCrash() {
            isPlayingCrash = true; balance -= bet; resetPirate();
            document.getElementById('main-action-btn').innerText = "RESGATAR";
            let crashPoint = Math.random() * 3 + 1.1;

            crashInterval = setInterval(() => {
                currentMult += 0.01;
                document.getElementById('crash-mult').innerText = currentMult.toFixed(2) + "x";
                const canvas = document.getElementById('pirate-canvas');
                const ship = document.getElementById('ship-wrapper');

                const x = (currentMult - 1) * 120 + 50;
                const y = canvas.height - (Math.log(currentMult) * 250 + 80);
                
                ship.style.left = `${x}px`; ship.style.top = `${y}px`;
                points.push({x: x + 35, y: y + 50});
                drawTrail();

                if(currentMult >= crashPoint) gameOverCrash();
            }, 60);
        }

        function stopCrash() {
            clearInterval(crashInterval); isPlayingCrash = false;
            let win = bet * currentMult; balance += win;
            document.getElementById('status-msg').innerText = "GANHOU: $" + win.toFixed(2);
            document.getElementById('main-action-btn').innerText = "ZARPAR";
            bet = 0; updateUI();
        }

        function gameOverCrash() {
            clearInterval(crashInterval); isPlayingCrash = false;
            document.getElementById('status-msg').innerText = "NAVIO AFUNDOU!";
            document.getElementById('main-action-btn').innerText = "ZARPAR";
            bet = 0; updateUI();
        }

        // --- SIMPLE GAMES ---
        function playSimple() {
            if(!selectedOption) return;
            balance -= bet;
            const visual = document.getElementById('simple-visual');
            visual.style.transform = "rotate(360deg)";
            setTimeout(() => {
                visual.style.transform = "rotate(0deg)";
                let won = false;
                if(currentGame === 'dice') {
                    let res = Math.floor(Math.random() * 6) + 1;
                    visual.innerText = res;
                    won = (selectedOption === 'Par' && res % 2 === 0) || (selectedOption === 'Ímpar' && res % 2 !== 0);
                } else {
                    let res = Math.random() > 0.5 ? 'Cara' : 'Coroa';
                    visual.innerText = (res === 'Cara') ? '🌞' : '🌛';
                    won = (selectedOption === res);
                }
                if(won) { balance += bet * 2; document.getElementById('status-msg').innerText = "VENCEU!"; }
                else { document.getElementById('status-msg').innerText = "PERDEU!"; }
                bet = 0; updateUI();
            }, 500);
        }

        // --- MINES ---
        function initMines() {
            const cont = document.getElementById('mines-container'); cont.innerHTML = "";
            for(let i=0; i<25; i++) {
                let b = document.createElement('button');
                b.className = 'mine-btn'; b.innerHTML = "★";
                b.onclick = () => { b.style.color = "var(--accent-gold)"; b.style.borderColor = "var(--accent-gold)"; };
                cont.appendChild(b);
            }
        }

        setGame('dice'); updateUI();
    </script>
</body>
</html>
